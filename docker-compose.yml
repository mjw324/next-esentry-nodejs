# Docker alternative to the WSL/native services (HARNESS_SERVICES=docker).
# Same ports, credentials and major versions as production (Postgres 16, Redis 8).
name: esentry-harness

services:
  postgres:
    image: postgres:16-alpine
    container_name: esentry-harness-pg
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: esentry
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harness -d esentry']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.2-alpine
    container_name: esentry-harness-redis
    # Mirrors production: no persistence needed, no maxmemory, noeviction.
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg:
